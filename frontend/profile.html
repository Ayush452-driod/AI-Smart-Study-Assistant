<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - AI Smart Study Assistant</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="profile-container">

    <a
        href="dashboard.html"
        class="back-link">

        ← Back to Dashboard

    </a>


    <div class="profile-card">

        <h1>
            My Profile
        </h1>


        <!-- PROFILE PICTURE -->

        <div id="profileAvatar"
             class="profile-avatar">

            👤

        </div>


        <input
            type="file"
            id="profilePicture"
            accept="image/*"
            hidden
        >


        <div class="profile-buttons">

            <button
                id="uploadBtn"
                class="btn secondary-btn">

                Upload Picture

            </button>

            <button
                id="removeBtn"
                class="btn danger-btn">

                Remove Picture

            </button>

        </div>


        <!-- PROFILE INFORMATION -->

        <div class="profile-form">

            <label>
                Name
            </label>

            <input
                type="text"
                id="profileName"
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
                disabled
            >


            <button
                id="saveProfileBtn"
                class="btn primary-btn">

                Save Changes

            </button>

        </div>


        <p id="profileMessage"
           class="message">
        </p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
