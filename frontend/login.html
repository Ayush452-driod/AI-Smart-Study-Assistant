<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Smart Study Assistant</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                AI Smart Study Assistant
            </div>

            <h2>Welcome Back</h2>

            <p class="auth-subtitle">
                Login to continue your learning journey.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="btn primary-btn full-btn">
                    Login
                </button>

            </form>

            <p id="message" class="message"></p>

            <p class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
